<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
    padding: 0;
    margin: 0;
    justify-content: center;
    align-items: center;
    display: flex;
    height: 100vh;
}

div.container {
    width: 300px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #000;
    border-radius: 5px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

form {
    display: flex;
    flex-direction: column;
}

input {
    border-radius: 10px;
    padding: 5px;
}

.register { 
    background-color: #4CAF50;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
}   

.register:hover {
    background-color: #45a049;
}

a {
    text-decoration: none;
    color: blue;
    margin-bottom: 1%;
    font-size: 14px;
}

a:hover {
    color: rgb(90, 0, 187);
}
    </style>
    <title>Register</title>
</head>
<body>
    <div class="container">
        <h1>Register</h1>
        <form action="Modul4_CSS_Ext.html" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br>
            <input type="submit" value="Register" class="register">
        </form>
    </div>
</body>
</html>
