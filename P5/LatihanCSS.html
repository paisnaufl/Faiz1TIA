<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css">
        b{
            color: lime;
            text-decoration: underline;
            font-family: Arial;
        }
        i,u {
            color: red;
        }
    </style>
    <title>Latihan CSS</title>
</head>
<body>
    Tulisan ini menggunakan <i>ITALIC</i><br>
    Tulisan ini menggunakan <b>BOLD</b><br>
    Tulisan ini menggunakan <u>UNDERLINE</u><br>
</body>
</html>
