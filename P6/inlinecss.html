<!DOCTYPE html>
<html lang="en">
<head>
    <title>Inline</title>
</head>
<body style="background-color: purple; font-family: Arial, Helvetica, sans-serif;">
    <fieldset>
        <legend style="color: white; font-size: x-large;">Selamat Datang</legend>
        <table>
            <tr>
                <td>Username</td>
                <td>:</td>
                <td><input type="text" placeholder="Username"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td>:</td>
                <td><input type="password" placeholder="Password"></td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Login">
                </td>
            </tr>
        </table>
    </fieldset>
</body>

</html>
