<!DOCTYPE html>
<html lang="en">
<head>
    <title>Data Blind Date</title>
</head>
<body>
    <h1>Selmat Datang di Form Blind Date</h1>
    <form action="Modul2_Latihan4.html" method="post">
        Nama : <input type="text" name="nama" size="30"><br>
        Tanggal Lahir : <input type="date" name="tanggal"><br>
        Umur : <input type="text" name="umur" size="3"><br>
        Jenis Kelamin : <br> 
        <input type="radio">Laki-Laki <br>
        <input type="radio">Perempuan<br>
        Asal : <br>
        <select name="daerah" size="1">
            <option>Sumatera
            <option>Jawa
            <option>Kalimantan
            <option>Sulawesi
            <option>Papua
            <option>Bali
        </select><br>
        Agama : <input type="text" name="agama" size="20"><br>
        No. Telp : <input type="text"  name="telp" size="13"><br>
        <input type="submit" name="kirim" id="kirim">
    </form>
</body>
</html
