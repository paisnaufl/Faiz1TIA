<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div{
            width: 100px;
            height: 100px;
            background: red;
            animation:myfirst 5s;
            -webkit-animation: myfirst 5s;
        }
        @keyframes myfirst{
            from {
                background: red;
            } to {
                background: yellow;
            }
        }
        @-webkit-keyframes{
            from {
                background: red;
            } to {
                background: yellow;
            }
        }
    </style>
    <title>CSS3 - Animasi Warna</title>
</head>
<body>
    <h3>Animasi Warna CSS3</h3>
    <div>
    </div>
</body>
</html>
