<!DOCTYPE html>
<html lang="en">
<head>
    <title>Formulir Pendaftaran</title>
</head>
<body>
    <h3>Formulir Pendaftaran Kuliah</h3>
    <form action="ok.html" method="post">
        Nama : <input type="text" name="nama" size="30"><br>
        Tanggal Lahir : <input type="date" name="tanggal"><br>
        Asal Sekolah : <input type="text" name="sekolah" size="30"><br>
        Jurusan : <br>
        <input type="radio" name="jurusan" value="IPA">IPA <br>
        <input type="radio" name="jurusan" value="IPS">IPS<br>
        <input type="radio" name="jurusan" value="Lainnya">Lainnya<br>
        Jenis Kelamin : <br>
        <input type="radio" name="kelamin" value="Laki-Laki">Laki-Laki <br>
        <input type="radio" name="kelamin" value="Perempuan">Perempuan<br>
        Agama : <input type="text" name="agama" size="20"><br>
        No. Telp : <input type="text"  name="telp" size="13"><br>
        Alamat : <input type="text" name="alamat" size="50"><br>
        Rapor Semester 1--5 : <input type="file" name="raport"><br>
        Foto 3x4 : <input type="file" name="foto"><br>
        <input type="submit" name="kirim" id="kirim">
        <input type="reset" name="reset" id="reset">
    </form>
</body>
</html>
