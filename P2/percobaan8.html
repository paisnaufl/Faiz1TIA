<!DOCTYPE html>
<html lang="en">
<head>
    <title>List</title>
</head>
<body bgcolor="#FFFFFF">
    <h4>Contoh penggunaan Ordered List</h4>
    <ol>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ol>
    <h4>Contoh penggunaan Unordered List</h4>
    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>
</body>
</html>
